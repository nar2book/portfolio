<body>

<section id="portfolio_head" class="portfolio_head">
  <div class="portfolio_head_inner">
    <h1 class="portfolio_head_title">hato Portfolio</h1>
    <p class="portfolio_head_subtitle">軌跡</p>
    <p class="portfolio_head_subtitle_2">the career trajectory</p>
  </div>
</section>

<section class="portfolio_works" id="portfolio-works">
  <div class="portfolio_works_inner">
    <p class="portfolio_works_eyebrow">Selected works</p>
    <h2 class="portfolio_works_title">Works</h2>
    <div class="portfolio_works_list" id="portfolio-works-list" aria-live="polite">
      <p class="portfolio_works_empty">作品は順次追加予定です。</p>
    </div>
  </div>
</section>
<script>
  (() => {
    const portfolioWorksList = document.getElementById('portfolio-works-list');

    const makeWorkItem = (work) => {
      const wrapper = document.createElement('article');
      wrapper.className = 'portfolio_work';

      const content = work.url ? document.createElement('a') : document.createElement('div');
      content.className = 'portfolio_work_link';
      if (work.url) content.href = work.url;

      if (work.image) {
        const image = document.createElement('img');
        image.className = 'portfolio_work_img';
        image.src = work.image;
        image.alt = work.image_alt || work.title || '';
        image.loading = 'lazy';
        content.append(image);
      }

      const body = document.createElement('div');
      body.className = 'portfolio_work_body';

      const meta = [work.category, work.year].filter(Boolean).join(' · ');
      if (meta) {
        const metaElement = document.createElement('p');
        metaElement.className = 'portfolio_work_meta';
        metaElement.textContent = meta;
        body.append(metaElement);
      }

      const title = document.createElement('h3');
      title.className = 'portfolio_work_title';
      title.textContent = work.title || '';
      body.append(title);

      if (work.description) {
        const description = document.createElement('p');
        description.className = 'portfolio_work_description';
        description.textContent = work.description;
        body.append(description);
      }

      content.append(body);
      wrapper.append(content);
      return wrapper;
    };

    const makeEmptyState = () => {
      const empty = document.createElement('p');
      empty.className = 'portfolio_works_empty';
      empty.textContent = '作品は順次追加予定です。';
      return empty;
    };

    fetch('data/portfolio.json')
      .then((response) => {
        if (!response.ok) throw new Error('Portfolio data could not be loaded.');
        return response.json();
      })
      .then((data) => {
        const heading = data.heading || {};
        document.querySelector('.portfolio_head_title').textContent = heading.title || 'hato Portfolio';
        document.querySelector('.portfolio_head_subtitle').textContent = heading.subtitle || '';
        document.querySelector('.portfolio_head_subtitle_2').textContent = heading.tagline || '';

        if (Array.isArray(data.works)) {
          portfolioWorksList.replaceChildren(
            ...(data.works.length ? data.works.map(makeWorkItem) : [makeEmptyState()])
          );
        }
      })
      .catch(() => {
        // The HTML above remains visible if the JSON file is temporarily unavailable.
      });
  })();
</script>
</body>
</html>
