<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>🔐</title>
  <style>
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px;
      font-family: "Montserrat", "Hiragino Sans", Meiryo, sans-serif;
      line-height: 1.8;
      color: #fff;
      background: #111;
    }
    .myVideo {
      display: block;
      width: min(640px, 100%);
      height: auto;
      margin: 0 auto;
    }
    @media screen and (max-width: 767px) {
      .myVideo {
        width: 100vw;
        max-width: none;
        margin-left: calc(50% - 50vw);
      }
    }
  </style>
</head>
<body>
  <main>
<video src="img/priv.mp4" controls autoplay muted class="myVideo"></video>
  </main>
  <script>
    if (sessionStorage.getItem('yamiyami-authenticated') !== 'true') {
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
